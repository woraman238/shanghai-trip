<title>Shanghai Trip Planner</title>

<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e7e2da;--red:#c8102e;--gold:#d4a017;--ok:#16a34a;--blue:#2563eb;--warnbg:#fff7e6;--warnln:#f5c26b;--r:14px;--shadow:0 2px 8px rgba(0,0,0,.04)}
body.dark{--bg:#121417;--card:#1c1f24;--ink:#e8e6e3;--mute:#9aa0a6;--line:#2c3138;--warnbg:#2e2614;--warnln:#6b5420;--shadow:0 2px 10px rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{margin:0;font-family:Prompt,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#8b0a1f,#c8102e 60%,#e0452f);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
.navwrap{position:sticky;top:0;z-index:1000;background:linear-gradient(90deg,#990b22,#c8102e 65%,#d93829);padding:4px 16px 0;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.wrap{max-width:1000px;margin:0 auto}
h1{margin:0;font-size:23px;letter-spacing:-.2px}h3{margin:0 0 12px;font-size:17px}
.sub{opacity:.92;font-size:13px;margin-top:2px}
.hchip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-size:13px;cursor:pointer;transition:.15s}
.hchip:hover{background:rgba(255,255,255,.28)}
.hchip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.live{color:#4ade80}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:0;color:#fff;opacity:.84;padding:9px 13px;font:inherit;font-size:14px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap;transition:background .15s,opacity .15s}
nav button:hover{opacity:1;background:rgba(255,255,255,.1)}
nav button.on{background:var(--bg);color:var(--ink);opacity:1;font-weight:600}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px}.stat span{color:var(--mute);font-size:13px}
.mute{color:var(--mute);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:10px;font:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.s{padding:3px 8px;font-size:13px;border-radius:8px}
.btn:hover{filter:brightness(.95)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(200,16,46,.35);border-color:var(--red)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);flex:none;margin:2px 0 0;cursor:pointer}
input[type=radio]{width:auto;accent-color:var(--red);cursor:pointer}
.fld{margin-bottom:10px}.fld>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.chk{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:14px;user-select:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:13px;color:#fff;font-weight:500}
.chip.off{background:transparent!important;color:var(--mute);border:1px dashed var(--line)}
.pill{padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
.hero{text-align:center;font-size:18px;background:linear-gradient(135deg,#fff7e0,#ffe9e9);border:0}
body.dark .hero{background:linear-gradient(135deg,#3a2d10,#3a1418)}
.hero b{font-size:40px;color:var(--red)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .3s}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.dnum{background:var(--red);color:#fff;border-radius:10px;padding:2px 10px;font-weight:600;margin-right:6px;display:inline-block}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-top:1px dashed var(--line)}
.item .body{flex:1;cursor:pointer;min-width:0}.item .t{font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.item .m{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.time{font-weight:600;color:var(--red);width:52px;flex:none}.time small{display:block;color:var(--mute);font-weight:400;font-size:11px}
.cost{text-align:right;font-weight:600;white-space:nowrap}.cost small{display:block;color:var(--mute);font-weight:400}
.acts{display:flex;gap:4px;flex-direction:column}
.done .t{text-decoration:line-through;opacity:.5}
.warn{background:var(--warnbg);border:1px solid var(--warnln);border-radius:10px;padding:7px 10px;font-size:13px;margin:6px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wx{display:inline-flex;gap:4px;align-items:center;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:1px 7px;border-radius:99px;font-weight:500;background:var(--bg);border:1px solid var(--line);color:var(--mute)}
.badge.ok{background:rgba(22,163,74,.12);border-color:rgba(22,163,74,.35);color:var(--ok)}
.badge.need{background:rgba(217,119,6,.14);border-color:rgba(217,119,6,.4);color:#d97706}
.nowcard{border:2px solid var(--red)}
.nowbox{padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:8px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:13px;color:var(--mute);font-weight:500}
.tw{overflow-x:auto}
.settle{padding:8px 0;border-bottom:1px solid var(--line)}
.settle:last-child{border-bottom:0}
.ck{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}.ck span{flex:1}.ck.done span{text-decoration:line-through;opacity:.5}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px}
.phr{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.phr .zh{font-size:19px;font-weight:600;cursor:pointer;color:var(--red)}
body.dark .phr .zh{color:#ff6b81}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:16px;z-index:2000}
#modal.show{display:flex}
.box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:500px;max-height:90vh;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.big{font-size:56px;text-align:center;font-weight:700;padding:30px 0;word-break:break-word;line-height:1.2}
.big2{font-size:42px;font-weight:700;line-height:1.25;word-break:break-word}
.taxi{text-align:center}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1f2328;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:3000;max-width:92vw;text-align:center;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.show{opacity:1;pointer-events:auto}
#toast button{background:var(--gold);color:#111;border:0;padding:3px 10px;border-radius:99px;font:600 13px inherit;cursor:pointer}
#map{height:62vh;min-height:360px}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font:600 13px Prompt,sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.wheel-wrap{position:relative;width:min(380px,82vw);margin:14px auto 0}
.wheel-wrap canvas{width:100%;display:block;cursor:pointer}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--ink);z-index:2}
.wres{font-size:21px;margin-top:12px;min-height:34px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.ph button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer}
.ph.add{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);cursor:pointer;color:var(--mute);font-size:18px}
.star{font-size:22px;color:var(--line);cursor:pointer;line-height:1}.star.on{color:var(--gold)}
.rate{display:grid;gap:4px;margin-bottom:10px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:900;border-radius:99px;padding:10px 15px;box-shadow:0 4px 14px rgba(200,16,46,.4);font-weight:600}
.pwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:16px;padding:8px 2px 12px}
.pcard{background:#fffdf9;color:#1f2328;border:1px solid #e5dec9;border-radius:12px;padding:10px 10px 12px;box-shadow:0 6px 16px rgba(0,0,0,.1);position:relative;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
body.dark .pcard{background:#252830;color:#f3f4f6;border-color:#383d47;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pcard:nth-child(odd){transform:rotate(-1.3deg)}
.pcard:nth-child(even){transform:rotate(1.3deg)}
.pcard:hover{transform:rotate(0deg) translateY(-4px) scale(1.02);box-shadow:0 12px 24px rgba(0,0,0,.18);z-index:2}
.ptape{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-2deg);padding:1px 12px;border-radius:3px;font-size:11px;font-weight:700;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);opacity:.92;white-space:nowrap;z-index:3}
.pframe{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.06)}
.pframe img{width:100%;height:100%;object-fit:cover;display:block}
.pframe.empty{border:2px dashed var(--line);flex-direction:column;gap:4px;padding:10px;text-align:center;color:var(--mute)}
.psticker{position:absolute;top:6px;left:6px;font-size:26px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));pointer-events:none}
.pstamp{position:absolute;bottom:6px;right:6px;border:2px solid #c8102e;color:#c8102e;background:rgba(255,252,245,.9);font-weight:700;font-size:11px;padding:1px 6px;border-radius:4px;transform:rotate(-10deg);box-shadow:0 1px 3px rgba(0,0,0,.15);pointer-events:none}
.pcap{margin-top:8px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.pcap .pt{font-weight:600;font-size:13.5px;line-height:1.3}
.pcap .pzh{font-size:12px;color:#c8102e;font-weight:600}
body.dark .pcap .pzh{color:#ff7b8b}
.pcap .pnote{font-size:12px;color:var(--mute);margin-top:3px;font-style:italic}
.ithumb{width:46px;height:46px;border-radius:8px;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.22);cursor:pointer;flex:none;background:var(--bg)}
.phin{width:42px;height:42px;border-radius:10px;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45);background-size:cover;background-position:center;position:relative}
.phin i{position:absolute;bottom:-5px;right:-5px;width:18px;height:18px;border-radius:50%;color:#fff;font:700 10px Prompt,sans-serif;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.stpick{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;font-size:20px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;transition:transform .1s}
.stpick.on{border:2px solid var(--red);background:rgba(200,16,46,.1);transform:scale(1.1)}
@media(max-width:600px){.time{width:46px}h1{font-size:20px}.hero b{font-size:32px}.big2{font-size:32px}main{padding:12px}.card{padding:14px}.pwall{grid-template-columns:repeat(2,1fr);gap:12px}}
@media print{header,.navwrap,.btn,.acts,.noprint,.fab,input[type=checkbox]{display:none!important}body{background:#fff;color:#000}.card{break-inside:avoid;border-color:#ccc;box-shadow:none}}
.langsw{display:inline-flex;gap:2px;align-items:center;margin-bottom:4px;background:rgba(255,255,255,.16);border-radius:99px;padding:2px 4px;font-size:12px}
.langsw button{background:transparent;border:0;color:#fff;font:inherit;padding:1px 9px;border-radius:99px;cursor:pointer;opacity:.85}
.langsw button.on{background:#fff;color:#8b0a1f;font-weight:700;opacity:1}
</style>
</head>

const LANGS={th:'ไทย',en:'English',zh:'中文'};
let LG='th';try{LG=localStorage.getItem('sh-lang')||'th'}catch(e){}
if(!LANGS[LG])LG='th';
const LOC=()=>({th:'th-TH',en:'en-US',zh:'zh-CN'}[LG]||'th-TH');
const hasTh=s=>/[\u0E00-\u0E3E\u0E40-\u0E7F]/.test(s);
const I18N={en:{ex:new Map(),fr:[]},zh:{ex:new Map(),fr:[]}};
(function buildI18n(){
  const fr={en:new Map(),zh:new Map()};
  I18N_ROWS.forEach(([th,en,zh,only])=>{
    I18N.en.ex.set(th,en);I18N.zh.ex.set(th,zh);
    if(!only){fr.en.set(th,en);fr.zh.set(th,zh)}else{fr.en.delete(th);fr.zh.delete(th)}
  });
  ['en','zh'].forEach(l=>{I18N[l].fr=[...fr[l]].sort((a,b)=>b[0].length-a[0].length)});
})();
const I18N_CACHE={en:new Map(),zh:new Map()};
const TRIM_RE=/^([^\u0E00-\u0E3E\u0E40-\u0E7FA-Za-z0-9฿]*)([\s\S]*?)([^\u0E00-\u0E3E\u0E40-\u0E7FA-Za-z0-9฿]*)$/;
function trLang(s){
  const d=I18N[LG],m=TRIM_RE.exec(s);
  if(m&&d.ex.has(m[2]))return m[1]+d.ex.get(m[2])+m[3];
  let r=s;
  for(const [k,v] of d.fr){if(r.includes(k))r=r.split(k).join(v)}
  return r.replace(/ {2,}/g,' ');
}
function T(s){
  if(LG==='th'||typeof s!=='string'||!hasTh(s))return s;
  const c=I18N_CACHE[LG];let r=c.get(s);
  if(r===undefined){r=trLang(s);if(c.size>4000)c.clear();c.set(s,r)}
  return r;
}
function trDom(root){
  if(!root||typeof document==='undefined')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode&&n.parentNode.nodeName;return(p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
    if(n.__o===undefined){if(!hasTh(n.nodeValue))return;n.__o=n.nodeValue}
    const v=T(n.__o);if(n.nodeValue!==v)n.nodeValue=v;
  });
  const els=root.querySelectorAll?root.querySelectorAll('[placeholder],[title],[aria-label]'):[];
  const fix=el=>{
    ['placeholder','title','aria-label'].forEach(a=>{
      if(!el.hasAttribute(a))return;
      el.__oa=el.__oa||{};
      if(el.__oa[a]===undefined){const v=el.getAttribute(a);if(!hasTh(v))return;el.__oa[a]=v}
      const v=T(el.__oa[a]);if(el.getAttribute(a)!==v)el.setAttribute(a,v);
    });
  };
  if(root.hasAttribute)fix(root);
  els.forEach(fix);
}
function applyLang(){
  if(typeof document==='undefined')return;
  document.documentElement.lang=LG==='zh'?'zh-CN':LG;
  trDom(document.body);
}
function setLang(l){
  if(!LANGS[l])return;
  LG=l;try{localStorage.setItem('sh-lang',l)}catch(e){}
  closeModal();render();applyLang();document.title=T(S.trip.name);
  toast({th:'เปลี่ยนเป็นภาษาไทยแล้ว',en:'Language: English',zh:'语言已切换为中文'}[l]);
}

}

const dist=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};

  const s=String(str||'').replace(/,/g,'').trim();
  if(!s)return 0;
  if(/^[0-9+\-*/.() ]+$/.test(s)){try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)&&v>=0?Math.round(v*100)/100:0}catch(e){}}
  return parseFloat(s)||0;
}
function toB64(str){
  const bytes=new TextEncoder().encode(str);let bin='';
  bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin);
}
function fromB64(b64){
  try{const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
  catch(e){return decodeURIComponent(escape(atob(b64)))}
}

let undoSnap=null;
function toast(t,undoFn=null){
  const el=document.getElementById('toast');
  if(undoFn){
    undoSnap=undoFn;
    el.innerHTML=`<span>${esc(T(t))}</span><button onclick="runUndo()">${T('↩️ เลิกทำ')}</button>`;
  }else{
    undoSnap=null;
    el.textContent=T(t);
  }
  el.classList.add('show');clearTimeout(el._t);
  el._t=setTimeout(()=>{el.classList.remove('show');undoSnap=null},undoFn?5000:2400);
}
function runUndo(){if(undoSnap){const fn=undoSnap;undoSnap=null;document.getElementById('toast').classList.remove('show');fn();toast('กู้คืนข้อมูลแล้ว ✓')}}
function snapForUndo(msg,mutator){
  const prev=JSON.stringify(S);
  mutator();
  commit();
  toast(msg,()=>{S=migrate(JSON.parse(prev));commit()});
}

}

function connect(){
  disconnect();if(!syncOn())return;
  if(!/^https:\/\/[^/]+\.(firebaseio\.com|firebasedatabase\.app)/.test(P.db)){setSync('err');return}
  setSync('wait');sync.ready=false;
  const es=new EventSource(base()+'/state.json');sync.es=es;
  es.addEventListener('put',e=>{
    let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(!m||m.path!=='/')return;
    const d=m.data,first=P.joined!==P.room;sync.ready=true;
    if(!d||!d.json){push();P.joined=P.room;saveJ(PKEY,P);setSync('on');return}
    if(d.by!==CLIENT&&(first||d.at>S.updatedAt)){
      try{S=migrate(JSON.parse(d.json));saveJ(KEY,S);P.joined=P.room;saveJ(PKEY,P);safeRender();if(!first)toast('🔄 มีการอัปเดตจากเพื่อน')}catch(x){}
    }else if(d.at<S.updatedAt)push();
    setSync('on');
  });
  ['cancel','auth_revoked'].forEach(t=>es.addEventListener(t,()=>setSync('err')));
  es.onerror=()=>setSync(navigator.onLine?'wait':'off');
  beat();sync.hb=setInterval(beat,25000);
}
function disconnect(){
  if(sync.es){sync.es.close();sync.es=null}clearInterval(sync.hb);sync.online={};
  if(syncOn())fetch(base()+'/presence/'+CLIENT+'.json',{method:'DELETE',keepalive:true}).catch(()=>{});
}

async function updateWeather(force){
  const n=S.days.length;if(!n||!navigator.onLine)return;
  if(!force&&W&&W.key===wKey()&&Date.now()-W.at<3*3600e3)return;
  const today=shNow().date,off=dayDiff(today,S.trip.start),end=off+n-1;
  const q='latitude=31.23&longitude=121.47&timezone=Asia%2FShanghai&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum';
  let url,mode,origin;
  if(end>=0&&off<=15){
    const s=iso(addDays(today,Math.max(0,off))),e=iso(addDays(today,Math.min(15,end)));
    url=`https://api.open-meteo.com/v1/forecast?${q},precipitation_probability_max&start_date=${s}&end_date=${e}`;mode='forecast';origin=S.trip.start;
  }else{
    const s=addDays(S.trip.start,0);s.setFullYear(s.getFullYear()-1);origin=iso(s);const e=iso(addDays(origin,n-1));
    if(dayDiff(e,today)<6)return;
    url=`https://archive-api.open-meteo.com/v1/archive?${q}&start_date=${origin}&end_date=${e}`;mode='last';
  }
  try{const d=await (await fetch(url)).json();if(!d.daily)return;const list=Array(n).fill(null),dl=d.daily;
    dl.time.forEach((t,j)=>{const k=dayDiff(origin,t);if(k>=0&&k<n)list[k]={c:dl.weather_code[j],max:dl.temperature_2m_max[j],min:dl.temperature_2m_min[j],rain:dl.precipitation_sum[j]??0,pp:dl.precipitation_probability_max?dl.precipitation_probability_max[j]:null}});
    W={key:wKey(),at:Date.now(),mode,list};saveJ(WKEY,W);safeRender()}catch(e){}

/* ================= Plan checker ================= */
function dayWarnings(d,k){
  const out=[],its=sortItems(d.items).filter(i=>toMin(i.time)!=null);
  for(let x=0;x<its.length-1;x++){
    const a=its[x],b=its[x+1],ae=toMin(a.time)+(+a.dur||0),bs=toMin(b.time);
    if(ae>bs)out.push(`<span>⏰ "${esc(a.title)}" ยังไม่จบ (ถึง ${fromMin(ae)}) แต่ "${esc(b.title)}" เริ่ม ${esc(b.time)}</span><button class="btn s" onclick="fixOverlap('${d.id}','${b.id}',${ae})">🔧 เลื่อนเป็น ${fromMin(ae)}</button>`);
    else if(a.cat!=='move'&&b.cat!=='move'){const p=pt(a.ll),q=pt(b.ll);if(p&&q){const km=dist(p,q),need=Math.round(km*3+12);
      if(need>bs-ae)out.push(`<span>🚇 "${esc(a.title)}" → "${esc(b.title)}" ห่าง ~${km.toFixed(1)} กม. ควรเผื่อ ~${need} นาที (มี ${bs-ae} นาที)</span><button class="btn s" onclick="insertTransit('${d.id}','${a.id}','${b.id}',${ae},${need})">➕ แทรกเดินทาง</button>`)}}
  }
  const tot=d.items.reduce((s,i)=>s+(+i.dur||0),0);
  if(d.items.length>8||tot>12*60)out.push(`<span>😵 วันนี้แน่นไป (${d.items.length} กิจกรรม ~${Math.round(tot/60)} ชม.)</span>`);
  const dc=dayCost(d)*S.trip.rate,db=S.trip.budget/Math.max(1,S.days.length);
  if(S.trip.budget&&dc>db)out.push(`<span>💸 ค่าใช้จ่ายตามแผนวันนี้ ~฿${fmt(dc)}/คน เกินงบเฉลี่ยต่อวัน ฿${fmt(db)}</span>`);
  const unbooked=d.items.filter(i=>i.book==='need'&&!i.done).length;
  if(unbooked)out.push(`<span>🎫 มี ${unbooked} กิจกรรมที่ต้องจองล่วงหน้าแต่ยังไม่ได้กดจอง</span>`);
  const w=wxAt(k);
  if(W&&W.mode==='forecast'&&isRainy(w)){const od=d.items.filter(i=>i.outdoor).length;
    if(od){let best=-1,bv=1e9;S.days.forEach((_,j)=>{const v=wxAt(j);if(j!==k&&v&&!isRainy(v)){const sc=(v.pp??0)+(v.rain||0)*5;if(sc<bv){bv=sc;best=j}}});
      out.push(`<span>☔ โอกาสฝน ${w.pp??'-'}% มีกิจกรรมกลางแจ้ง ${od} รายการ</span>`+(best>=0?`<button class="btn s" onclick="swapPlan(${k},${best})">🔄 สลับกับวันที่ ${best+1}</button>`:''))}}
  return out;
}
function fixOverlap(dId,bId,newMin){
  const d=dayById(dId),b=d?.items.find(x=>x.id===bId);if(!b)return;
  b.time=fromMin(newMin);commit();toast('ปรับเวลาเป็น '+b.time+' แล้ว ✓');
}
function insertTransit(dId,aId,bId,startMin,durMin){
  const d=dayById(dId),a=d?.items.find(x=>x.id===aId),b=d?.items.find(x=>x.id===bId);if(!d||!b)return;
  const endMin=startMin+durMin;
  if(toMin(b.time)<endMin)b.time=fromMin(endMin);
  d.items.push({id:uid(),time:fromMin(startMin),dur:durMin,title:`เดินทางไป ${b.title}`,cat:'move',place:b.place||'',zh:b.zh||'',addr:'',ll:'',outdoor:false,book:'',cost:5,note:'Metro / DiDi',done:false});
  commit();toast('แทรกรายการเดินทางแล้ว ✓');
}
function shiftDayTime(dId,delta){
  const d=dayById(dId);if(!d||!d.items.length)return;
  d.items.forEach(i=>{const m=toMin(i.time);if(m!=null)i.time=fromMin(m+delta)});
  commit();toast(`เลื่อนเวลาทั้งวัน ${delta>0?'+':''}${delta} นาทีแล้ว ✓`);
}
function swapPlan(a,b){const A=S.days[a],B=S.days[b];[A.title,B.title]=[B.title,A.title];[A.items,B.items]=[B.items,A.items];commit();toast(`สลับแผนวันที่ ${a+1} ↔ ${b+1} แล้ว`)}

async function drawMap(){
  const el=document.getElementById('map');if(!el)return;
  try{loadCSS('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css');await loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js')}
  catch(e){el.innerHTML='<p class="mute" style="padding:16px">โหลดแผนที่ไม่ได้ (ต้องต่ออินเทอร์เน็ตครั้งแรก)</p>';return}
  if(map){try{map.remove()}catch(e){}map=null}
  if(!document.getElementById('map'))return;
  if(!L._trp){const _bp=L.Layer.prototype.bindPopup;L.Layer.prototype.bindPopup=function(c,o){return _bp.call(this,typeof c==='string'?T(c):c,o)};L._trp=1}
  map=L.map(el).setView([31.23,121.47],12);
  const tl=TILES[P.tile]||TILES.osm;
  L.tileLayer(tl.url,{maxZoom:19,attribution:tl.attr}).addTo(map);
  const b=[],icon=(c,t)=>L.divIcon({className:'',html:`<div class="pin" style="background:${c}">${t}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
  S.days.forEach((d,k)=>{
    if(mapDay!==''&&mapDay!==String(k))return;
    const col=DAYCOL[k%10],line=[];
    sortItems(d.items).forEach((i,n)=>{const p=pt(i.ll);if(!p)return;line.push(p);b.push(p);
      const ph=PH['it_'+i.id];
      const mkIcon=ph?L.divIcon({className:'',html:`<div class="phin" style="background-image:url('${ph}')"><i style="background:${col}">${n+1}</i></div>`,iconSize:[42,42],iconAnchor:[21,21]}):icon(col,n+1);
      L.marker(p,{icon:mkIcon}).addTo(map).bindPopup(`${ph?`<img src="${ph}" style="width:160px;height:120px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px">`:''}<b>D${k+1} · ${esc(i.time)} ${esc(i.title)}</b><br>${esc(i.zh||i.place)}${i.pCap?`<br><span style="color:#c8102e">"${esc(i.pCap)}"</span>`:''}<br><a href="#" onclick="openPlacePhoto('${d.id}','${i.id}');return false">📸 โพลารอยด์</a> · <a href="#" onclick="taxi('${d.id}','${i.id}');return false">🚕 แท็กซี่</a>`)});
    if(line.length>1)L.polyline(line,{color:col,weight:3,opacity:.75,dashArray:'6 6'}).addTo(map);
  });
  const h=pt(S.trip.hotel.ll);if(h){b.push(h);L.marker(h,{icon:icon('#111','🏨')}).addTo(map).bindPopup('🏨 '+esc(S.trip.hotel.name||'โรงแรม')+'<br><a href="#" onclick="taxiHotel();return false">🚕 การ์ดกลับโรงแรม</a>')}
  if(b.length)map.fitBounds(b,{padding:[30,30],maxZoom:15});
}
function locateMe(){
  if(!navigator.geolocation)return toast('อุปกรณ์ไม่รองรับ GPS');
  toast('🛰️ กำลังหาตำแหน่งปัจจุบัน...');
  navigator.geolocation.getCurrentPosition(pos=>{
    const p=[pos.coords.latitude,pos.coords.longitude];
    if(!map)return;
    if(myLocMarker)try{map.removeLayer(myLocMarker)}catch(e){}
    const icon=L.divIcon({className:'',html:`<div class="pin" style="background:#2563eb;width:30px;height:30px">📍</div>`,iconSize:[30,30],iconAnchor:[15,15]});
    myLocMarker=L.marker(p,{icon}).addTo(map).bindPopup('<b>📍 ตำแหน่งของคุณตอนนี้</b>').openPopup();
    map.setView(p,15);
    toast('พบตำแหน่งของคุณแล้ว ✓');
  },()=>toast('ไม่สามารถเข้าถึงตำแหน่งได้ (กรุณาอนุญาต GPS)'));
}

/* ================= Money ================= */
function balances(){
  const b={};S.members.forEach(m=>b[m.id]={paid:0,share:0});
  S.expenses.forEach(e=>{
    const v=toTHB(e),rate=e.currency==='THB'?1:S.trip.rate;
    if(e.mode==='custom'&&e.shares){
      const entries=Object.entries(e.shares).filter(([id,amt])=>b[id]&&+amt>0);
      if(!entries.length)return;
      if(b[e.payer])b[e.payer].paid+=v;
      entries.forEach(([id,amt])=>b[id].share+=(+amt)*rate);
    }else{
      const sp=(e.split||[]).filter(id=>b[id]);if(!sp.length)return;
      if(b[e.payer])b[e.payer].paid+=v;
      sp.forEach(id=>b[id].share+=v/sp.length);
    }
  });
  return b;
}
function settle(b){
  const a=Object.entries(b).map(([id,x])=>({id,v:x.paid-x.share}));
  const cr=a.filter(x=>x.v>0.5).sort((x,y)=>y.v-x.v),db=a.filter(x=>x.v<-0.5).sort((x,y)=>x.v-y.v),res=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const amt=Math.min(-db[i].v,cr[j].v);res.push({from:db[i].id,to:cr[j].id,amt});db[i].v+=amt;cr[j].v-=amt;if(-db[i].v<0.5)i++;if(cr[j].v<0.5)j++}
  return res;
}

function parseReceipt(t){
  const lines=t.split('\n'),num=s=>(s.replace(/[,，]/g,'').replace(/．/g,'.').match(/\d+(?:\.\d{1,2})?/g)||[]).map(parseFloat);let best=null;
  lines.forEach(l=>{if(/合计|总计|实付|应付|实收|总额|小计|total|amount/i.test(l.replace(/\s+/g,''))){const n=num(l).filter(x=>x>0&&x<100000);if(n.length)best=n[n.length-1]}});
  if(best==null){const all=lines.flatMap(l=>/\d\.\d{2}/.test(l)?num(l):[]).filter(x=>x>0&&x<100000);best=all.length?Math.max(...all):0}
  return best;
}
async function scanReceipt(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  modalHTML(`<h3>📷 กำลังอ่านใบเสร็จ...</h3><div class="bar"><i id="ocrBar" style="width:5%"></i></div><p class="mute" id="ocrMsg">กำลังโหลดตัวอ่าน (ครั้งแรกโหลดข้อมูลภาษาจีนนานหน่อย)</p>`);
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    const w=await Tesseract.createWorker('chi_sim+eng',1,{logger:m=>{const b=document.getElementById('ocrBar'),t=document.getElementById('ocrMsg');if(b&&m.progress!=null)b.style.width=Math.max(5,Math.round(m.progress*100))+'%';if(t&&m.status)t.textContent=m.status}});
    const {data:{text}}=await w.recognize(f);await w.terminate();
    const amt=parseReceipt(text);closeModal();
    editExp(null,{amount:amt,currency:'CNY',desc:'ใบเสร็จ'});toast(amt?`อ่านยอดได้ ¥${amt} ตรวจสอบก่อนบันทึก`:'อ่านยอดไม่ได้ กรอกเองได้เลย');
  }catch(e){closeModal();toast('สแกนไม่สำเร็จ ลองใหม่ (ต้องมีเน็ตครั้งแรก)')}
}

function setPlaceMeta(key,val,fromInput=false){
  if(!curStudio)return;
  const d=dayById(curStudio.dId),i=d?.items.find(x=>x.id===curStudio.iId);if(!i)return;
  i[key]=val;
  if(!fromInput){
    saveLater();
    openPlacePhoto(curStudio.dId,curStudio.iId);
  }else{
    saveLater();
    drawPlaceCard();
  }
}
async function uploadPlaceImg(inp){
  const f=inp.files[0];inp.value='';if(!f||!curStudio)return;
  toast('✨ กำลังย่อและแต่งรูปโพลารอยด์...');
  try{
    const data=await compress(f,960,.72);
    const d=dayById(curStudio.dId),i=d?.items.find(x=>x.id===curStudio.iId);
    if(i){
      PH['it_'+i.id]=data;
      i.done=true;
      if(!i.pBy&&P.me)i.pBy=P.me;
      savePH();touch();
      openPlacePhoto(curStudio.dId,curStudio.iId);
      toast('📸 เช็คอินรูปสถานที่เรียบร้อย!');
    }
  }catch(e){toast('ไม่สามารถโหลดรูปนี้ได้')}
}
function delPlacePhoto(){
  if(!curStudio||!confirm('ลบรูปเช็คอินของสถานที่นี้?'))return;
  const {dId,iId}=curStudio;
  delete PH['it_'+iId];savePH();
  openPlacePhoto(dId,iId);
  toast('ลบรูปแล้ว');
}
function drawCoverImg(x,img,X,Y,W,H,r=0){
  x.save();
  if(r){x.beginPath();if(x.roundRect)x.roundRect(X,Y,W,H,r);else x.rect(X,Y,W,H);x.clip()}
  const s=Math.max(W/img.width,H/img.height),dw=img.width*s,dh=img.height*s;
  x.drawImage(img,X+(W-dw)/2,Y+(H-dh)/2,dw,dh);
  x.restore();
}

async function makePolaroidCollage(){

  const cols=list.length<=4?2:3;

function compress(file,max=900,q=.65){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s|0;c.height=img.height*s|0;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=url})}

function graphemes(t){try{return [...new Intl.Segmenter('th',{granularity:'grapheme'}).segment(t)].map(s=>s.segment)}catch(e){return Array.from(t)}}
function wrapText(x,t,X,Y,maxW,lh,maxL=2){
  const tt=T(String(t));const g=LG==='en'?(tt.match(/\S+\s*|\s+/g)||[]):graphemes(tt);let line='',n=1;
  for(let i=0;i<g.length;i++){const test=line+g[i];
    if(x.measureText(test).width>maxW&&line){
      if(n>=maxL){while(x.measureText(line+'…').width>maxW&&line.length>1)line=line.slice(0,-1);x.fillText(line+'…',X,Y);return Y+lh}
      x.fillText(line,X,Y);Y+=lh;n++;line=g[i];
    }else line=test}
  x.fillText(line,X,Y);return Y+lh;
}

function setupWheel(){
  if(ui.game==='food'){
    const opts=[...new Set([...S.foods,...S.wishlist.filter(w=>w.cat==='food').map(w=>w.name)])];
    wheel.segs=opts.map((l,i)=>({label:T(l),w:1,color:PAL[i%PAL.length]}));

  }else{

    wheel.segs=S.members.map((m,i)=>({label:T(m.name),id:m.id,w:ui.payMode==='fair'?(mx-paid[i])+mx*0.15+1:1,color:m.color}));
    const tot=wheel.segs.reduce((s,x)=>s+x.w,0),od=document.getElementById('odds');
    if(od)od.innerHTML=T('โอกาส: ')+wheel.segs.map(s=>`${esc(s.label)} ${Math.round(s.w/tot*100)}%`).join(' · ');
    wheel.cb=s=>res(`💸 รอบนี้ <b>${esc(s.label)}</b> จ่าย!<br><button class="btn s" onclick="editExp(null,{payer:'${s.id}'})">📝 บันทึกรายจ่าย</button>`);
  }
  drawWheel();if(document.fonts)document.fonts.ready.then(drawWheel);

function res(h){const el=document.getElementById('wres');if(el)el.innerHTML=T(h)}
function drawWheel(){
  const c=document.getElementById('wheel');if(!c)return;const x=c.getContext('2d'),R=c.width/2,segs=wheel.segs;x.clearRect(0,0,c.width,c.height);
  if(!segs.length){x.font='28px Prompt';x.textAlign='center';x.fillStyle='#999';x.fillText('ยังไม่มีตัวเลือก',R,R);return}
  const tot=segs.reduce((s,g)=>s+g.w,0);let a=wheel.rot;
  segs.forEach(g=>{const sw=g.w/tot*2*Math.PI;x.beginPath();x.moveTo(R,R);x.arc(R,R,R-4,a,a+sw);x.closePath();x.fillStyle=g.color;x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();
    x.save();x.translate(R,R);x.rotate(a+sw/2);x.textAlign='right';x.fillStyle='#fff';x.font='600 26px Prompt, sans-serif';x.fillText(trunc(g.label,14),R-24,9);x.restore();a+=sw});
  x.beginPath();x.arc(R,R,36,0,2*Math.PI);x.fillStyle='#fff';x.fill();x.font='32px sans-serif';x.textAlign='center';x.fillText('🎲',R,R+11);
}
function spin(){
  if(wheel.spinning||!wheel.segs.length)return;
  const segs=wheel.segs,tot=segs.reduce((s,g)=>s+g.w,0),TWO=2*Math.PI;
  let r=Math.random()*tot,idx=0;for(;idx<segs.length-1;idx++){r-=segs[idx].w;if(r<=0)break}
  let start=0;for(let j=0;j<idx;j++)start+=segs[j].w/tot*TWO;
  const mid=start+segs[idx].w/tot*TWO*(0.2+Math.random()*0.6),target=-Math.PI/2-mid,cur=wheel.rot;
  const end=cur+(((target-cur)%TWO)+TWO)%TWO+TWO*6;
  wheel.spinning=true;res('🌀 ...');const t0=performance.now(),D=4200;
  (function f(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,4);wheel.rot=cur+(end-cur)*e;drawWheel();
    if(p<1)requestAnimationFrame(f);else{wheel.spinning=false;wheel.rot=end%TWO;wheel.cb&&wheel.cb(segs[idx])}})(t0);
}

function setMember(id,k,v){const m=S.members.find(x=>x.id===id);m[k]=v||m[k];commit()}
function addMember(){S.members.push({id:uid(),name:'เพื่อน '+(S.members.length+1),color:PAL[(S.members.length+4)%PAL.length]});commit()}
function delMember(id){
  if(S.members.length<=1)return toast('ต้องมีสมาชิกอย่างน้อย 1 คน');
  const paidCount=S.expenses.filter(e=>e.payer===id).length;
  const others=S.members.filter(m=>m.id!==id);
  const msg=paidCount?`ยืนยันการลบ ${M(id).name}? (รายการที่ ${M(id).name} เคยจ่าย ${paidCount} รายการจะถูกโอนให้ ${others[0].name})`:`ยืนยันการลบ ${M(id).name}?`;
  if(!confirm(msg))return;
  snapForUndo(`ลบแล้ว: ${M(id).name}`,()=>{
    S.members=others;
    S.expenses.forEach(e=>{
      e.split=(e.split||[]).filter(x=>x!==id);
      if(e.shares)delete e.shares[id];
      if(e.payer===id)e.payer=S.members[0].id;
    });
    S.expenses=S.expenses.filter(e=>e.split.length);
    S.wishlist.forEach(w=>w.votes=w.votes.filter(x=>x!==id));
    S.checklist.forEach(c=>{if(c.owner===id)c.owner='all'});
    S.days.forEach(d=>delete d.diary.ratings[id]);
    if(P.me===id){P.me='';saveJ(PKEY,P)}
  });
}
function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=`shanghai-trip-${iso(new Date())}.json`;a.click();toast('ดาวน์โหลดไฟล์สำรองแล้ว')}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.days||!d.members)throw 0;if(confirm('นำเข้าและแทนที่ข้อมูลปัจจุบัน?')){S=migrate(d);commit();toast('นำเข้าสำเร็จ ✓')}}catch(e){alert('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f)}
function shareLink(){copyText(location.href.split('#')[0]+'#d='+toB64(JSON.stringify(S)),'คัดลอกลิงก์แล้ว 🔗')}

/* Generate PNG Apple Touch Icon for iOS Homescreen */
function genAppleIcon(){
  try{
    const c=document.createElement('canvas');c.width=180;c.height=180;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#8b0a1f');g.addColorStop(1,'#e0452f');
    x.fillStyle=g;x.fillRect(0,0,180,180);
    x.fillStyle='#fff';x.font='bold 68px sans-serif';x.textAlign='center';x.fillText('上海',90,110);
    x.fillStyle='#ffd166';x.font='600 18px sans-serif';x.fillText('SHANGHAI',90,148);
    const l=document.getElementById('appleIcon');if(l)l.href=c.toDataURL('image/png');
  }catch(e){}
}
